name: Publish stack images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [di, typescript]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          STACK: ${{ matrix.stack }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            changed=true
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- "$STACK"; then
            changed=false
          else
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.changed == 'true'

      - uses: docker/login-action@v3
        if: steps.changes.outputs.changed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: stack
        if: steps.changes.outputs.changed == 'true'
        env:
          STACK: ${{ matrix.stack }}
        run: echo "tree_sha=$(git rev-parse HEAD:$STACK)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        if: steps.changes.outputs.changed == 'true'
        with:
          context: .
          file: .github/stack.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            STACK=${{ matrix.stack }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/dagr-stacks-${{ matrix.stack }}:${{ steps.stack.outputs.tree_sha }}
            ghcr.io/${{ github.repository_owner }}/dagr-stacks-${{ matrix.stack }}:latest
