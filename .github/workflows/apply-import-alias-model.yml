name: Apply import alias model

on:
  push:
    branches:
      - model-import-alias

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: model-import-alias
      - name: Update TypeScript alias model
        run: |
          python <<'PY'
          from pathlib import Path

          module = Path('typescript/dagr.module.js')
          text = module.read_text()
          old = """  'packageJson.imports': di.toFun(\n    ['sourceAlias'],\n    alias => alias === undefined ? undefined : { [alias.specifier]: alias.sourcePath },\n  ),"""
          new = """  'packageJson.imports': di.toFun(\n    ['importAlias'],\n    alias => alias === undefined ? undefined : { [alias.specifier]: alias.runtimePath },\n  ),"""
          assert old in text
          text = text.replace(old, new)
          old = """  'tsconfig.compilerOptions.paths': di.toFun(\n    ['sourceAlias'],\n    alias => alias === undefined ? undefined : { [alias.specifier]: [alias.sourcePath] },\n  ),"""
          new = """  'tsconfig.compilerOptions.paths': di.toFun(\n    ['importAlias'],\n    alias => alias === undefined ? undefined : { [alias.specifier]: [alias.sourcePath] },\n  ),"""
          assert old in text
          module.write_text(text.replace(old, new))

          features = Path('typescript/dagr.features.js')
          text = features.read_text().replace('sourceAlias', 'importAlias')
          old = """    importAlias: di.toFun(\n      ['sourceDirectory'],\n      directory => ({ specifier: '#/*', sourcePath: `./${directory}/*` }),\n    ),"""
          new = """    importAlias: di.toFun(\n      ['sourceDirectory'],\n      directory => ({\n        specifier: '#/*',\n        sourcePath: `./${directory}/*`,\n        runtimePath: `./${directory}/*`,\n      }),\n    ),"""
          assert text.count(old) == 2
          features.write_text(text.replace(old, new))

          tests = Path('tests/dagr.typescript-composition.test.js')
          text = tests.read_text().replace('sourceAlias', 'importAlias')
          marker = """  it('derives worker policy instead of accepting raw tsconfig', () => {"""
          addition = """  it('projects one import alias to source and runtime destinations', () => {\n    const aliases = di.module({\n      importAlias: di.toFun(\n        ['sourceDirectory', 'outputDirectory'],\n        (source, output) => ({\n          specifier: '#*',\n          sourcePath: `./${source}/*`,\n          runtimePath: `./${output}/*`,\n        }),\n      ),\n    })\n    const { workspace } = moduleFor([library({ runtime: 'node' }), aliases])\n    const build = workspace('ci:build')\n\n    assert.deepEqual(build.tsconfig.compilerOptions.paths, { '#*': ['./src/*'] })\n    assert.deepEqual(build.packageJson.imports, { '#*': './dist/*' })\n  })\n\n"""
          assert marker in text
          tests.write_text(text.replace(marker, addition + marker))
          PY
      - name: Commit model change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add typescript/dagr.module.js typescript/dagr.features.js tests/dagr.typescript-composition.test.js
          git commit -m 'Model source and runtime import aliases together'
          git push origin HEAD:model-import-alias
